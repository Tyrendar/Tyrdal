name: order-checking

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: checking
      POSTGRES_USER: checking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checking -d checking"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://checking:${POSTGRES_PASSWORD}@db:5432/checking
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MEDIA_ROOT: /data/media
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CHECK_DEBOUNCE_MS: ${CHECK_DEBOUNCE_MS:-700}
    volumes:
      - media:/data/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # Admin panel + single entry point: serves the web app and proxies /api to the backend.
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

  # Nightly logical backup kept for 14 days in the `backups` volume.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c 'while true; do
        f=/backups/checking-$$(date +%Y%m%d-%H%M).dump;
        pg_dump -h db -U checking -d checking -Fc -f $$f && echo "backup $$f";
        find /backups -name "checking-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  pgdata:
  media:
  backups:
